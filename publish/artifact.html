<title>Data Contract Validator</title>

<!--
  Publish wrapper for the Artifact host, which supplies its own
  <!doctype>/<head>/<body> — so this file carries page content only.

  The app's own stylesheet (src/index.css, built to dist/app.css) is inlined
  here because it is a few hundred bytes and the page should paint its own
  dark ground before the bundle evaluates. Everything else is the built
  bundle, published alongside this file as app.js.

  To republish: npm run build, then publish this file with
  files: { "app.js": "dist/app.js" }.
-->
<style>
  :root {
    color-scheme: dark;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* The host paints its ground in the viewer's theme; this app is
     deliberately single-theme, so it paints its own. */
  body {
    margin: 0;
    background: #0e1416;
    min-height: 100vh;
  }

  * {
    box-sizing: border-box;
  }

  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid #57c7d4;
    outline-offset: 2px;
  }

  p {
    margin: 0;
  }

  #root:empty::after {
    content: 'Loading the validator…';
    display: block;
    padding: 32px 20px;
    color: #8a9a9e;
    font: 14px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
</style>

<div id="root"></div>
<script type="module" src="app.js"></script>
