name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first run: the older result is
# about code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 needs 20.19+ or 22.12+. Pinned to the LTS line rather than
          # "latest" so a new Node release cannot break the build on its own.
          node-version: '22'
          cache: npm

      # ci, not install: installs exactly what package-lock.json pins and fails
      # if the lockfile and package.json disagree.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

  # Row-level security is the whole access model: the publishable key ships in
  # the bundle, so these policies are what keep one account's contracts and
  # runs from another. A throwaway Postgres runs supabase/schema.sql against
  # two accounts and an anonymous visitor (supabase/tests/rls.sql); a policy
  # that lets anything cross fails the build.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/verify-rls.sh
